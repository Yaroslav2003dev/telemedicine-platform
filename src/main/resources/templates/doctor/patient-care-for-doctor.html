<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Централизованная дистанционная система медицинского обслуживания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="/css/styleday.css" />
</head>
<body>
    <nav class="navbar navbar-bg fixed-top">
        <div class="container-fluid">
          <a class="navbar-text" href="#">Централизованная дистанционная система медицинского обслуживания</a>
         
          <div class="nav-toggle">
            <div class="nav-toggle-bar"></div>
          </div>
          
          <nav id="nav" class="nav">
            <ul>
              <li><a href="/doctor">Личный кабинет</a></li>
              <li><a href="/doctor/patient-care-for-doctor">Обслуживание пациента</a></li>
              <li><a href="/doctor/patients/search">Картотека</a></li>
              <li><a href="https://t.me/Medical_Assistant99_bot">Ассистент с ИИ</a></li>
              <li>
                <form id="logoutForm" action="/logout" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">Выход</a>
                </form>
              </li>
            </ul>
          </nav>
        </div>
      </nav>
      
    <div class="container-main d-flex justify-content-center flex-column align-items-center">
      <h3 class="patient-care">Обслуживание пациентов</h3>
      <div class="container">
        <div class="left">
          <div class="calendar">
            <div class="month">
              <i class="fas fa-angle-left prev"></i>
              <div class="date">december 2015</div>
              <i class="fas fa-angle-right next"></i>
            </div>
            <div class="weekdays">
              <div>Пн</div>
              <div>Вт</div>
              <div>Ср</div>
              <div>Чт</div>
              <div>Пт</div>
              <div>Сб</div>
              <div>Вс</div>
            </div>
            <div class="days"></div>
            <div class="goto-today">
              <div class="goto">
                <!-- <input type="text" placeholder="mm/yyyy" class="date-input" />
                <button class="goto-btn">Go</button> -->
              </div>
              <button class="today-btn">Сегодня</button>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="today-date">
            <div class="event-date">12th december 2022</div>
          </div>
          <div class="events"></div>
          <div class="add-event-wrapper">
            <div class="add-event-header">
              <div class="title">Add Event</div>
              <i class="fas fa-times close"></i>
            </div>
            <div class="add-event-body">
              <div class="add-event-input">
                <input type="text" placeholder="Специальность/ФИО врача" class="event-name" />
              </div>
              <div class="add-event-input">
                <input
                  type="text"
                  placeholder="Время приёма"
                  class="event-time-from"
                />
              </div>
              <div class="add-event-input">
                <input
                  type="text"
                  placeholder="Event Time To"
                  class="event-time-to"
                />
              </div>
            </div>
            <div class="add-event-footer">
              <button class="add-event-btn">Add Event</button>
            </div>
          </div>
        </div>
        <button class="add-event">
          <i class="fas fa-plus"></i>
        </button>
      </div>
      <div class="button-start-cons">
        <a href="/chat/index.html">
        <button type="button" class="btn btn-outline-success cons-start">Начать консультацию</button>
        </a>
      </div>
    </div>

    
        
    <script src="/js/scriptday.js"></script>
        <script src="/js/script.js"></script>
</body>
</html>
