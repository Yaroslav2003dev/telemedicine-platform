<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Централизованная дистанционная система медицинского обслуживания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
<!--  <link rel="stylesheet" href="styleday.css" />-->
</head>
<body>
<nav class="navbar navbar-bg fixed-top">
    <div class="container-fluid">
        <a class="navbar-text" href="#">Централизованная дистанционная система медицинского обслуживания</a>

        <div class="nav-toggle">
            <div class="nav-toggle-bar"></div>
        </div>

        <nav id="nav" class="nav">
            <ul>
                <li><a href="/doctor">Личный кабинет</a></li>
                <li><a href="/doctor/patient-care-for-doctor">Обслуживание пациента</a></li>
                <li><a href="/doctor/patients/search">Картотека</a></li>
                <li><a href="https://t.me/Medical_Assistant99_bot">Ассистент с ИИ</a></li>
                <li>
                    <form id="logoutForm" action="/logout" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">Выход</a>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</nav>

    

    <div class="container-filter">
        <!-- <div class="vrach-card-all d-flex flex-column align-items-center"> -->
        <form action="/doctor/patients/search" method="GET" class="card-filter">
            <div class="card-filter d-flex justify-content-center">
            <div class="d-flex flex-column align-items-center me-1">
                <label for="lastName">Фамилия</label>
                <input class="form-control" type="text" id="lastName" name="lastName" placeholder="Введите фамилию" />
            </div>

            <div class="d-flex flex-column align-items-center mb-3 me-1">
                <label for="firstName" >Имя</label>
                <input class="form-control" type="text" id="firstName" name="firstName" placeholder="Введите имя" />
            </div>

            <div class="d-flex flex-column align-items-center me-1">
                <label for="middleName">Отчество</label>
                <input class="form-control" type="text" id="middleName" name="middleName" placeholder="Введите отчество" />
            </div>

            <div class="d-flex flex-column align-items-center me-1">
                <label for="birthDate" class="card-filter-age">Дата рождения</label>
                <input class="form-control" type="date" id="birthDate" name="birthDate" />
            </div>

            <div class="filter-buttons">
                <button class="btn btn-success" type="submit">Фильтровать</button>
                <button class="btn btn-danger" type="reset">Очистить</button>
            </div>
            </div>
        </form>


        <ul th:each="el : ${patients}" class="patient-card-all d-flex flex-column align-items-center">
            <!-- <div class="card vrach-card-content justify-content-center mb-5 "> -->

            <li class="card patient-card-content justify-content-center mb-3 ">
                <a th:href="'/doctor/patient-lk/'+${el.id}">
                  <div class="patient-content-text d-flex">
                    <div  class="patient-card-name d-flex pt-1 ps-1">
                        <p class="lastname" th:text="${el.lastname}" ></p>
                        <p class="firstname" th:text="${el.firstname}"></p>
                        <p class="patronymic" th:text="${el.patronymic}+','"></p>
                    </div>
                    <p class="patient-card-age pt-1" th:text="${el.getFormattedDate()}"> 21 год</p>
                  </div>
            </a>
            </li>

        </ul>
    </div>
        
<script src="/js/scriptfilter.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
