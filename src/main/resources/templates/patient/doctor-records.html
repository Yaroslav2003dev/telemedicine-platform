<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Централизованная дистанционная система медицинского обслуживания</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" type="text/css" href="/css/style.css" />
</head>
<body>
<nav class="navbar navbar-bg fixed-top">
    <div class="container-fluid">
        <a class="navbar-text" href="#">Централизованная дистанционная система медицинского обслуживания</a>

        <div class="nav-toggle">
            <div class="nav-toggle-bar"></div>
        </div>

        <nav id="nav" class="nav">
            <ul>
                <li><a href="/patient">Личный кабинет</a></li>
                <li><a href="/patient/doctors/search">Список врачей</a></li>
                <li><a href="/patient/patient-care-for-patient">Запись</a></li>
                <li><a href="https://t.me/Medical_Assistant99_bot">Ассистент с ИИ</a></li>
                <li>
                    <form id="logoutForm" action="/logout" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">Выход</a>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</nav>

<div class="container-main d-flex justify-content-center flex-column align-items-center">
    <h3 class="patient-care">Выбор врача</h3>
    <form action="/patient/doctors/search" method="GET" class="card-filter">
        <div class="card-filter d-flex justify-content-center">
            <div class="d-flex flex-column align-items-center me-1">
                <label for="lastName" class="label-filter-lastName">Фамилия</label>
                <input class="form-control" type="text" id="lastName" name="lastName" placeholder="Введите фамилию" />
            </div>

            <div class="d-flex flex-column align-items-center mb-3 me-1">
                <label for="firstName" class="label-filter-firstName">Имя</label>
                <input class="form-control" type="text" id="firstName" name="firstName" placeholder="Введите имя" />
            </div>

            <div class="d-flex flex-column align-items-center me-1">
                <label for="middleName" class="label-filter-middleName">Отчество</label>
                <input class="form-control" type="text" id="middleName" name="middleName" placeholder="Введите отчество" />
            </div>

            <div class="d-flex flex-column align-items-center me-1">
                <label for="speciality" class="label-filter-speciality">Специальность</label>
                <input class="form-control" type="text" id="speciality" name="speciality" placeholder="Введите специальность" />
            </div>

            <div class="filter-buttons">
                <button class="btn btn-success" type="submit">Фильтровать</button>
                <button class="btn btn-danger" type="reset">Очистить</button>
            </div>
        </div>
    </form>
    <div  class="filter-vrach-cards d-flex flex-wrap justify-content-center">
        <div th:each="doctor : ${doctors}" class="filter-vrach-card card mt-2 me-3">
            <div class="card-body">
                <div class="filter-vrach-content d-flex">
                    <div class="filter-vrach-img p-2">
                        <img class="filter-vrach-img-q" src="/images/Vector%201.svg" alt="">
                    </div>
                    <div class="filter-vrach-text flex-column justify-content-between">
                        <div class="filter-vrach-text-details d-flex justify-content-center">
                            <h5 th:text="${doctor.speciality}+','" class="filter-vrach-speciality">Хируkkkkkkkkkkkkkkkkkkkрг,</h5>
                            <h5 th:text="'стаж: '+${doctor.experience}+' года'" class="filter-vrach-stag ms-1">2 года</h5>
                        </div>
                        <div class="filter-vrach-text-fio d-flex justify-content-center">
                            <div class="fio-border-bottom">
                                <a th:href="@{/patient/doctors/{id}(id=${doctor.id})}">
                                    <h4 th:text="${doctor.lastname}" class="filter-vrach-lastname me-1">Толкач</h4>
                                    <h4 th:text="${doctor.firstname}" class="filter-vrach-firstname me-1">Ярослав</h4>
                                    <h4 th:text="${doctor.patronymic}" class="filter-vrach-patronymic me-1">Игоревич</h4>
                                </a>
                            </div>
                        </div>
                        <div class="filter-button-block d-flex justify-content-center mt-3 mb-3 pt-3">
                            <a href="/patient/patient-care-for-patient">
                            <button type="button" class="btn btn-outline-primary">Записаться</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
<script src="/js/script.js"></script>
</body>
</html>
