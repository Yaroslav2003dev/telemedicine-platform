<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аутентификация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" type="text/css" href="/css/style.css" />

</head>
<body>
<nav class="navbar navbar-bg fixed-top">
  <div class="container-fluid">
    <a class="navbar-text" href="#">Централизованная дистанционная система медицинского обслуживания</a>
  </div>
</nav>

<div class="container-reg-login d-flex justify-content-center mt-5 pt-5">
    <div class="card form-regis">
      <div class="card-body">
        <p class="form-regis-title">Авторизация</p>
        <form action="/login" method="post" class="p-3">
          <!-- CSRF-токен -->
          <input type="hidden" name="_csrf" th:value="${_csrf.token}" />

          <!-- Email (логин) -->
          <div class="mt-3">
            <label for="loginEmail" class="form-label">Адрес электронной почты</label>
            <input type="email" class="form-control" name="username" id="loginEmail" required>
          </div>

          <!-- Пароль -->
          <div class="mt-3">
            <label for="loginPassword" class="form-label">Пароль</label>
            <input type="password" class="form-control" name="password" id="loginPassword" required>
          </div>

          <!-- Выбор роли -->
<!--          <div class="mt-3">-->
<!--            <label class="form-label">Выберите роль:</label>-->
<!--            <div class="form-check form-check-inline">-->
<!--              <input class="form-check-input" type="radio" name="role" id="patientRole" value="patient" checked>-->
<!--              <label class="form-check-label" for="patientRole">Пациент</label>-->
<!--            </div>-->
<!--            <div class="form-check form-check-inline">-->
<!--              <input class="form-check-input" type="radio" name="role" id="doctorRole" value="doctor">-->
<!--              <label class="form-check-label" for="doctorRole">Врач</label>-->
<!--            </div>-->
<!--          </div>-->

          <div class="register-group d-flex justify-content-between">
          <button type="submit" class="btn btn-success mt-5">Войти</button>
            <a class="register-group-open" href="/register">Зарегистрироваться</a>
          </div>
        </form>

      </div>
  </div>
</div>
