<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" type="text/css" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<!--  <link rel="stylesheet" href="/css/styleday.css" />-->
</head>
<body>
<nav class="navbar navbar-bg fixed-top">
  <div class="container-fluid">
    <a class="navbar-text" href="#">Централизованная дистанционная система медицинского обслуживания</a>
  </div>
</nav>
<div class="container-reg-login d-flex justify-content-center">
<div class="card form-regis">
  <div class="card-body">
    <p class="form-regis-title">Регистрация</p>
    <form action="/register" method="post" class="p-3">
      <input type="hidden" name="_csrf" th:value="${_csrf.token}">
      <!-- Фамилия -->
      <div class="mt-3">
        <label for="lastname" class="form-label">Фамилия</label>
        <input type="text" class="form-control" name="lastname" id="lastname" required>
      </div>
      <!-- Имя -->
      <div class="mt-3">
        <label for="firstname" class="form-label">Имя</label>
        <input type="text" class="form-control" name="firstname" id="firstname" required>
      </div>
      <!-- Отчество -->
      <div class="mt-3">
        <label for="patronymic" class="form-label">Отчество</label>
        <input type="text" class="form-control" name="patronymic" id="patronymic">
      </div>
      <!-- Email -->
      <div class="mt-3">
        <label for="email" class="form-label">Адрес электронной почты</label>
        <input type="email" class="form-control" name="email" id="email" required>
      </div>
      <!-- Пароль -->
      <div class="mt-3">
        <label for="password" class="form-label">Пароль</label>
        <input type="password" class="form-control" name="password" id="password" required>
      </div>
      <!-- Переключатель: пациент или врач -->
      <div class="mt-3">
        <label class="form-label">Выберите тип пользователя:</label>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="role" id="patientRadio" value="patient" checked>
          <label class="form-check-label" for="patientRadio">Пациент</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="role" id="doctorRadio" value="doctor">
          <label class="form-check-label" for="doctorRadio">Врач</label>
        </div>
      </div>
      <div class="register-group d-flex justify-content-between">
      <button type="submit" class="btn btn-primary mt-5">Зарегистрироваться</button>
        <a class="register-group-open" href="/login">Войти</a>
      </div>
    </form>

</div>
</div>
</div>
</body>
</html>
